plugins { id 'java'; id 'application' }

group = 'studio.crazeai'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
 implementation 'com.github.tjake:jlama-core:0.8.4'
 implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
 runtimeOnly 'ch.qos.logback:logback-classic:1.5.6'
}
application {
 mainClass = 'studio.crazeai.cloud.CrazeAiApplication'
 applicationDefaultJvmArgs = ['--enable-preview', '--add-modules=jdk.incubator.vector']
}
jar {
 manifest { attributes('Main-Class': application.mainClass.get()) }
 duplicatesStrategy = DuplicatesStrategy.EXCLUDE
 from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}
tasks.withType(JavaCompile).configureEach {
 options.encoding = 'UTF-8'
 options.compilerArgs += ['--enable-preview', '--add-modules=jdk.incubator.vector']
}
