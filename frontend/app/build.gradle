plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.craze.cloud'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.craze.cloud'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
