services:
  - type: web
    name: crazeai-cloud
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: API_KEY
        sync: false
      - key: LLAMA_ARG_HOST
        value: 0.0.0.0
      - key: LLAMA_ARG_PORT
        value: 8080
      - key: LLAMA_ARG_CTX_SIZE
        value: 1024
      - key: LLAMA_ARG_N_PARALLEL
        value: 1
      - key: LLAMA_ARG_THREADS
        value: 1
      - key: LLAMA_ARG_BATCH
        value: 64
      - key: LLAMA_ARG_UBATCH
        value: 32
      - key: LLAMA_ARG_CACHE_TYPE_K
        value: q8_0
      - key: LLAMA_ARG_CACHE_TYPE_V
        value: q8_0
      - key: LLAMA_ARG_TEMP
        value: 0.2
      - key: LLAMA_ARG_TOP_P
        value: 0.85
      - key: LLAMA_ARG_TOP_K
        value: 20
      - key: LLAMA_ARG_REPEAT_PENALTY
        value: 1.15
      - key: LLAMA_ARG_REPEAT_LAST_N
        value: 128
      - key: LLAMA_ARG_ALIAS
        value: HuggingFaceTB/SmolLM2-135M-Instruct
