services:
  - type: web
    name: crazeai-cloud
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: CRAZEAI_API_KEY
        generateValue: true
      - key: CRAZEAI_MODEL
        value: "tensorblock/SmolLM2-360M-Instruct-GGUF:Q4_0"
      - key: CRAZEAI_CONTEXT
        value: "256"
      - key: CRAZEAI_MAX_TOKENS
        value: "192"
      - key: JINFER_MODELS
        value: "/var/cache/crazeai/jinfer"
