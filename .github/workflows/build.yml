name: Validate CrazeAI Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python client
        run: python -m py_compile crazeai.py
      - name: Validate Docker entrypoint
        run: sh -n docker-entrypoint.sh
      - name: Check deployment files
        run: |
          test -s Dockerfile
          test -s render.yaml
          test -s docker-entrypoint.sh
