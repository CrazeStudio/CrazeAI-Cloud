name: Export Android-Friendly Coding GGUF

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-gguf.yml"

permissions:
  contents: read

concurrency:
  group: export-android-coding-gguf
  cancel-in-progress: false

jobs:
  export-model:
    name: Download and package Qwen2.5-Coder 1.5B Q4_K_M
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare output directory
        run: mkdir -p exported-model

      - name: Download Android-friendly coding model
        env:
          MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true
        run: |
          set -euo pipefail
          curl --location --fail --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 \
            "$MODEL_URL" \
            --output exported-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf

      - name: Validate GGUF file and record metadata
        run: |
          set -euo pipefail
          MODEL="exported-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
          test -s "$MODEL"
          MAGIC="$(head -c 4 "$MODEL")"
          if [ "$MAGIC" != "GGUF" ]; then
            echo "::error::Downloaded file does not have the GGUF magic header."
            file "$MODEL" || true
            exit 1
          fi

          SIZE="$(stat -c '%s' "$MODEL")"
          SHA="$(sha256sum "$MODEL" | cut -d ' ' -f 1)"
          echo "Model: Qwen2.5-Coder 1.5B Instruct" >> "$GITHUB_STEP_SUMMARY"
          echo "Quantization: Q4_K_M" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: Android phones running llama.cpp-compatible apps" >> "$GITHUB_STEP_SUMMARY"
          echo "File: $MODEL" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: `$SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF on Hugging Face" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$MODEL"

      - name: Upload downloadable GGUF artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrazeAI-Qwen2.5-Coder-1.5B-Q4_K_M-Android
          path: exported-model/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
